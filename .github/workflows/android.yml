name: Android

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

jobs:
  build:
    name: Unit, lint, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Run lint
        run: ./gradlew :app:lintDebug
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Assemble unsigned release
        run: ./gradlew :app:assembleRelease
      - name: Upload reports and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/**
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

  instrumentation-api29:
    name: API 29 instrumentation smoke test
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run API 29 smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          disable-linux-hw-accel: false
          emulator-options: -no-window -noaudio -no-boot-anim
          disable-animations: true
          script: for attempt in 1 2 3; do ./gradlew :app:connectedDebugAndroidTest && break; if [ "$attempt" = 3 ]; then exit 1; fi; sleep 30; done
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
